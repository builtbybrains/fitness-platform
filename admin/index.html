<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- connect-src: the admin Edge Function. If the database moves off Supabase, change it here and API_BASE in admin.js.
       The sha256 in style-src allows the printable invoice's one style block (supabase/functions/admin/invoice.ts, INVOICE_CSS);
       the invoice opens as a blob that inherits this policy. Change both together. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'sha256-Hbs3vrHMTiJCGX6HoJP3jNcuuw57W6FFqa5kWJfQ8Gc='; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Admin | BUILT</title>
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../assets/img/favicon.svg?v=built1" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.2A6.5 6.5 0 0 1 21.5 20"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l2.6-7.4A2 2 0 0 1 7.5 4.3h9a2 2 0 0 1 1.9 1.3L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M9.9 5.8A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.4 7.4A16.5 16.5 0 0 0 2.5 12S6 18.5 12 18.5a9.4 9.4 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3.5h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.6 6.6l1.4-2.3 4.5 1.8V19a2 2 0 0 1-2.2 2A17 17 0 0 1 3 5.7 2 2 0 0 1 5 3.5z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></symbol>
    <symbol id="i-customers" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 16.5a3.5 3.5 0 0 1 7 0M15 10h3M15 14h3"/></symbol>
    <symbol id="i-finance" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8.8c-.6-.9-1.7-1.3-3-1.3-1.8 0-3 .9-3 2.2 0 3.2 6 1.6 6 4.6 0 1.4-1.3 2.3-3 2.3-1.4 0-2.6-.5-3.2-1.5M12 5.5v2M12 16.5v2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></symbol>
  </svg>

  <!-- ===== Sign in ===== -->
  <div class="login" id="login" hidden>
    <div class="login__brand">
      <img src="../assets/img/logo.svg" alt="BUILT" width="193" height="40">
      <p class="login__line">Every member, every report, one place.</p>
    </div>
    <form class="login__card" id="login-form" novalidate>
      <h1 class="login__title">Admin sign in</h1>
      <p class="notice" id="login-notice" role="status" hidden></p>
      <div class="field">
        <label for="login-user">Username</label>
        <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64">
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <div class="field__pass">
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="200">
          <button type="button" class="icon-btn" id="login-reveal" aria-label="Show password" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="#i-eye"/></svg></button>
        </div>
      </div>
      <div class="alert" id="login-error" role="alert" hidden></div>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">Sign in</button>
      <p class="login__small">Sessions end after 12 hours or when you close this tab.</p>
    </form>
  </div>

  <!-- ===== Dashboard ===== -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <img class="topbar__mark" src="../assets/img/mark.svg" alt="BUILT" width="31" height="24">
      <span class="topbar__title" id="topbar-title">Overview</span>
      <button type="button" class="icon-btn js-logout" aria-label="Sign out"><svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg></button>
    </header>

    <aside class="rail">
      <img class="rail__logo" src="../assets/img/logo.svg" alt="BUILT" width="145" height="30">
      <p class="rail__sub">Admin</p>
      <nav class="nav" aria-label="Sections">
        <a class="nav__link" href="#/overview" data-nav="overview"><svg class="ico" aria-hidden="true"><use href="#i-overview"/></svg><span>Overview</span></a>
        <a class="nav__link" href="#/users" data-nav="users"><svg class="ico" aria-hidden="true"><use href="#i-users"/></svg><span>Users</span></a>
        <a class="nav__link" href="#/customers" data-nav="customers"><svg class="ico" aria-hidden="true"><use href="#i-customers"/></svg><span>Customers</span></a>
        <a class="nav__link" href="#/finance" data-nav="finance"><svg class="ico" aria-hidden="true"><use href="#i-finance"/></svg><span>Finance</span></a>
        <a class="nav__link" href="#/reports" data-nav="reports"><svg class="ico" aria-hidden="true"><use href="#i-inbox"/></svg><span>Reports</span><span class="nav__badge" id="nav-badge" hidden></span></a>
      </nav>
      <div class="rail__foot">
        <p class="rail__session" id="session-note"></p>
        <button type="button" class="btn btn-secondary btn-sm js-logout"><svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg>Sign out</button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">This dashboard needs JavaScript turned on.</p></noscript>
</body>
</html>
