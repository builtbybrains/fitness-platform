# Supabase CLI settings for the Edge Functions (read by `supabase functions
# deploy`). Only what differs from the defaults is listed.
project_id = "fitness-platform"

# The admin dashboard is not a Supabase user, so the admin function checks
# its own session token instead of a Supabase JWT.
[functions.admin]
verify_jwt = false

# Listed although it is the default: delete-account uses the service role,
# so the platform must check the person's JWT before the code runs.
[functions.delete-account]
verify_jwt = true
