name: design-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install
        run: |
          bun install --frozen-lockfile
          # The gate drives a browser; Playwright is a tool here, not a site dependency.
          bun add --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build
        run: NITRO_PRESET=node-server bun run build
      - name: Design gate
        if: hashFiles('app/**', 'src/**', 'pages/**') != ''
        run: |
          PORT=3000 node .output/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/ || { echo "site did not start within 60s"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          node scripts/design-gate.mjs --url http://localhost:3000
      - name: No app here
        if: hashFiles('app/**', 'src/**', 'pages/**') == ''
        run: echo "no app/ src/ or pages/ in this repo; the gate runs once a demo exists"
      - name: Upload gate shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gate-shots
          path: shots/gate
