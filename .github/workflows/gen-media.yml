name: Generate app media (meal photos, workout videos)

# Builds mobile/assets/meals/*.webp, mobile/src/data/mealImages.generated.ts
# and mobile/src/data/exerciseVideos.generated.json with scripts/gen-media.mjs
# and commits them back to the branch that ran it. Existing files are kept,
# so re-runs only fill gaps. Run it by hand (Actions → this workflow → Run),
# never on its own.

on:
  # Manual only. Meal photos wait for a paid, watermark-free image provider
  # (the free one stamps "pollinations.ai" on every photo), so this workflow
  # only looks for workout videos until then.
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate everything (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: gen-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the image encoder
        run: npm install --no-save --no-package-lock sharp@0.33

      - name: Generate
        continue-on-error: true
        run: node scripts/gen-media.mjs --videos-only ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit the results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in mobile/assets/meals mobile/src/data/mealImages.generated.ts mobile/src/data/exerciseVideos.generated.json .github/gen-media-last-run.log; do
            [ -e "$p" ] && git add -A "$p"
          done
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Generate meal photos and workout videos (scripts/gen-media.mjs)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
