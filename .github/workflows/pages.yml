name: Publish website to GitHub Pages

on:
  push:
    branches: [claude/premium-ai-diet-training-site-uqlb73]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages serves files as they are. The Expo app in mobile/ has to be
      # built before a browser can run it, so it is not part of this.
      - name: Collect the static site
        run: |
          rm -rf _site && mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'mobile' \
            --exclude 'vercel.json' \
            --exclude '.vercelignore' \
            --exclude 'CLAUDE.md' \
            ./ _site/
          touch _site/.nojekyll

      - name: Replace the gh-pages branch with it
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
