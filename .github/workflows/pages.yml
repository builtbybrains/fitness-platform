name: Publish website to GitHub Pages

on:
  # Manual only. The site and the app are hosted on Vercel, which deploys every
  # pushed branch; each automatic push to gh-pages (no mobile/ folder) made the
  # app's Vercel project fail with "Root Directory mobile does not exist".
  # Run it by hand (Actions → this workflow → Run) if GitHub Pages is turned on.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Allowlist copy: only the public site, the admin dashboard (admin/:
      # static HTML/CSS/JS, noindex, no secrets) and the app's web build go out. Internal files
      # (.claude/, brain/, scripts/, supabase/, mobile/, CLAUDE.md, DESIGN.md,
      # README.md, package.json) never reach the gh-pages branch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The app's web version, served at /fitness-platform/app/ for testing in
      # a phone or desktop browser. The base URL is set only for this build,
      # so app.json stays deployable at a domain root (Vercel, native builds).
      - name: Build the app for the web
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/fitness-platform/app'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx expo export --platform web --clear --output-dir ../_app

      - name: Collect the static site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          mkdir _site/admin
          cp admin/index.html admin/admin.css admin/admin.js _site/admin/
          cp -R _app _site/app
          # Pages has no rewrites: a deep link or refresh inside the app (for
          # example /fitness-platform/app/plan) lands on this page, which sends
          # it back to the app's start, where it routes itself.
          cat > _site/404.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>BUILT</title>
          <script>
            var base = '/fitness-platform/app';
            if (location.pathname.indexOf(base) === 0) location.replace(base + '/');
            else location.replace('/fitness-platform/');
          </script>
          HTML
          touch _site/.nojekyll
          echo "Publishing:" && (cd _site && find . -type f | sort)

      - name: Replace the gh-pages branch with it
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
