name: Publish website to GitHub Pages

on:
  push:
    branches: [claude/premium-ai-diet-training-site-uqlb73]
    # Only the website files publish. Commits that touch only mobile/ or
    # supabase/ (or anything else) do not republish the site.
    paths:
      - 'index.html'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Allowlist copy: only the public site goes out. Internal files
      # (.claude/, brain/, scripts/, supabase/, mobile/, CLAUDE.md, DESIGN.md,
      # README.md, package.json) never reach the gh-pages branch.
      - name: Collect the static site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          cp index.html robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          echo "Publishing:" && (cd _site && find . -type f | sort)

      - name: Replace the gh-pages branch with it
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
